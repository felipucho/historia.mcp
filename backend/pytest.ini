[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    mongo: necesita MongoDB real (MONGODB_URL_TEST); se salta si la variable no está
filterwarnings =
    error::mcp.shared.exceptions.MCPDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
